<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Second Attempt</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">Logo goes here Dashboard
            </div>
            <nav class="nav-group">
                <a href="#">Home</a>
            </nav>

            <nav class="nav-group settings-group">
                <a href="#">Settings</a>
            </nav>
        </div>

        <header class="header">
            <div class="header-top">
                <div class="search-bar">Search...</div>
                <div class="user-profile-top">User Profile Info</div>
            </div>

            <div class="header-bottom">
                <div class="user-welcome">Hi there, username @handle</div>

                <div class="menu-buttons">
                    <button class="btn">New</button>
                    <button class="btn">Upload</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <h2>Your Projects</h2>
            <div class="project-grid">
                <div class="project-card">
                    <div class="card-actions">

                    </div>
                </div>
            </div>
        </div>

        <div class="widgets-sidebar">
            <div class="widget-section">
                <h2>Announcements</h2>
                <div class="widget-card">
                    <div class="announcement-item">
                        <h4>Site Maintenance</h4>
                        <p>Text....</p>
                    </div>
                </div>
            </div>
            <div class="widget-section">
                <h2>Trending</h2>
                <div class="widget-card">
                    <div class="trending-item">
                        <h4>username and avatar</h4>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
